name: Scrape and self-heal

# The CI story: a scheduled scrape that repairs its own scraper when the target
# site changes shape, without a human in the loop.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:
    inputs:
      auto_heal:
        description: 'Attempt bdata scraper heal when extraction returns nothing'
        type: boolean
        default: true

concurrency:
  group: scrape-and-heal
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The SQLite file is cached between runs so the diff engine has a previous
      # snapshot to compare against — that is what makes alerts meaningful.
      - name: Restore scrape history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: scrapeverse-db-${{ github.run_id }}
          restore-keys: scrapeverse-db-

      - name: Run scraper (auto-heals on empty extraction)
        working-directory: backend
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          COLLECTOR_ID: ${{ secrets.COLLECTOR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DB_PATH: ../data/scrapeverse.db
          AUTO_HEAL: ${{ inputs.auto_heal == false && 'false' || 'true' }}
          MAX_CATEGORIES: 6
        run: npm run scrape

      - name: Save scrape history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: scrapeverse-db-${{ github.run_id }}

      - name: Upload structured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output-${{ github.run_id }}
          path: data/
          retention-days: 14
